<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Кто сорвал сделку</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Lora:ital,wght@0,500;1,500&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
/* Тренажёр-детектив в стиле школы Оксаны: тёмная сцена, оранжевая улика. Один экран за раз, телефон в приоритете. */
:root{
  --bg:#0E0C0D;
  --panel:#1C1719;
  --line:#3A3134;
  --ink:#F3EDE4;
  --soft:#C9C0B5;
  --mute:#8C847C;
  --accent:#F07A2B;
  --accent-deep:#B8420C;
  --good:#7CC59A;
  --good-bg:#14261C;
  --bad-bg:#2B1710;
  --display:"Oswald","Arial Narrow",Arial,sans-serif;
  --serif:"Lora",Georgia,serif;
  --body:"Source Sans 3","Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 var(--body);min-height:100vh;
  padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
p{margin:0}
h1,h2{font-family:var(--display);font-weight:700;text-transform:uppercase;margin:0;line-height:1;letter-spacing:-.5px;text-wrap:balance}
h1{font-size:clamp(46px,13vw,68px)}
h1 em{font-style:normal;color:var(--accent)}
h2{font-size:clamp(28px,7.5vw,36px);line-height:1.05}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.top-in{max-width:560px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;letter-spacing:3px;text-transform:uppercase;color:var(--mute);font-weight:600}
.score{font:600 14px var(--display);letter-spacing:1px;color:var(--bg);background:var(--accent);padding:5px 12px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.score.bump{animation:bump .45s ease}
@keyframes bump{40%{transform:scale(1.15)}}
.wrap{max-width:560px;margin:0 auto;padding-top:22px}
.panel{display:flex;flex-direction:column;gap:18px;animation:in .3s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.eyebrow{font-size:13px;letter-spacing:4px;text-transform:uppercase;color:var(--accent);font-weight:700}
.muted{color:var(--soft);font-size:15px}
.lead{font-size:19px;color:var(--soft)}

.say{display:flex;gap:12px;align-items:flex-start;min-width:0}
.say.right{flex-direction:row-reverse}
.face{flex:none;width:52px;height:52px;border-radius:50%;overflow:hidden;background:var(--panel);display:grid;place-items:center;font:700 22px var(--display);color:var(--accent);border:2px solid var(--line)}
.face.ox{border-color:var(--accent)}
.face img{width:100%;height:100%;object-fit:cover;display:block}
.bubble{min-width:0;background:var(--panel);border-radius:4px 18px 18px 18px;padding:11px 15px;font-size:17px;line-height:1.45}
.say.right .bubble{border-radius:18px 4px 18px 18px;background:#2A2023}
.bubble small{display:block;font:600 12px var(--body);letter-spacing:3px;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.story{border-left:5px solid var(--accent);padding:4px 0 4px 18px;font:italic 500 20px/1.45 var(--serif);color:var(--ink)}

.choices{display:flex;flex-direction:column;gap:10px}
.ch{appearance:none;cursor:pointer;text-align:left;font:600 17px/1.3 var(--body);color:var(--ink);background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:16px;min-height:52px;transition:border-color .15s,transform .1s}
.ch:hover{border-color:var(--accent)}
.ch:active{transform:translateY(1px)}
.ch.primary{background:var(--accent);border-color:var(--accent);color:#120A05;text-align:center;font-family:var(--display);font-size:20px;letter-spacing:1px;text-transform:uppercase;font-weight:600}
.ch.primary:hover{background:#FF8C3F}
.ch.ghost{background:transparent;text-align:center;color:var(--soft);font-weight:500}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

.map{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.loc{appearance:none;cursor:pointer;text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;color:var(--ink);font:600 17px/1.2 var(--display);text-transform:uppercase;letter-spacing:.3px;min-height:128px;position:relative}
.loc:hover{border-color:var(--accent)}
.loc small{font:400 14px/1.3 var(--body);text-transform:none;letter-spacing:0;color:var(--soft)}
.loc .lt{font:700 12px var(--body);letter-spacing:3px;color:var(--accent)}
.loc.done{background:var(--good-bg);border-color:#2F5E43}
.loc.done::after{content:"улика";position:absolute;top:12px;right:12px;font:700 11px var(--body);letter-spacing:2px;text-transform:uppercase;color:var(--good)}
.map .loc:last-child:nth-child(odd){grid-column:1/-1;min-height:0}

/* экраны-улики: телефон Лены */
.phone{background:#141011;border:1.5px solid var(--line);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:9px}
.ph-h{display:flex;align-items:center;gap:10px;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--mute);font-weight:600;padding-bottom:8px;border-bottom:1px solid var(--line)}
.msg{max-width:92%;padding:9px 12px;border-radius:4px 14px 14px 14px;background:var(--panel);font-size:16px;line-height:1.4}
.msg.me{align-self:flex-end;border-radius:14px 4px 14px 14px;background:#2E2024}
.msg.client{background:#222A2E}
.msg.thought{align-self:center;max-width:100%;background:transparent;border:1.5px dashed var(--line);border-radius:14px;font:italic 500 17px/1.4 var(--serif);color:var(--soft)}
.msg small{display:block;font:600 11px var(--body);letter-spacing:2px;text-transform:uppercase;color:var(--mute);margin-bottom:2px}
.note{padding:10px 13px;border-radius:12px;background:var(--panel);font-size:16px;line-height:1.4}

[data-spot]{cursor:pointer;outline:2px dashed transparent;outline-offset:3px;transition:outline-color .2s,background .2s}
.hunt [data-spot]{outline-color:rgba(240,122,43,.35);animation:pulse 1.9s ease-in-out infinite}
@keyframes pulse{50%{outline-color:rgba(240,122,43,.8)}}
[data-spot].fine{outline:2px solid #2F5E43;animation:none;background:var(--good-bg)}
[data-spot].caught{outline:3px solid var(--accent);animation:none;background:var(--bad-bg)}
.hint{font-size:15px;color:var(--soft)}

.fb{border-radius:14px;padding:13px 16px;font-size:16.5px;animation:in .25s ease both}
.fb b{display:block;font:600 13px var(--display);letter-spacing:2.5px;text-transform:uppercase;margin-bottom:3px}
.fb.good{background:var(--good-bg);color:#CFE8D8}.fb.good b{color:var(--good)}
.fb.bad{background:var(--bad-bg);color:#F1D3C2}.fb.bad b{color:var(--accent)}
.fb.clue{background:var(--accent);color:#1A0D04}.fb.clue b{color:#4A1E05}

.vs{display:grid;grid-template-columns:1fr;gap:10px}
.opt{appearance:none;cursor:pointer;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;font:inherit;color:inherit}
.opt:hover{border-color:var(--accent)}
.opt .lab{font:700 12px var(--body);letter-spacing:3px;text-transform:uppercase;color:var(--mute)}
.opt .mini{font-size:17px;line-height:1.4}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{opacity:.55}
.opt[disabled]{cursor:default}

.tip{border:1.5px solid var(--line);border-radius:14px;padding:13px 16px;font-size:16.5px;background:var(--panel)}
.tip b{display:block;font:600 13px var(--display);letter-spacing:2.5px;text-transform:uppercase;color:var(--accent);margin-bottom:3px}

.chain{display:flex;flex-direction:column;gap:0}
.chain span{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:600;font-size:16.5px}
.chain span small{display:block;font:600 11px var(--body);letter-spacing:2.5px;text-transform:uppercase;color:var(--accent)}
.chain i{font-style:normal;color:var(--accent);font:700 18px var(--display);padding:2px 0 2px 22px;line-height:1.2}
.stamp{align-self:flex-start;font:700 20px var(--display);letter-spacing:2px;text-transform:uppercase;padding:6px 14px;border:3px solid currentColor;border-radius:8px;transform:rotate(-3deg);color:var(--accent)}
.stamp.top3{color:var(--good)}
.week{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.week li::marker{color:var(--accent);font-weight:700}
.recap{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.recap li{display:flex;gap:12px;align-items:baseline;font-size:16.5px}
.recap li b{flex:none;font:600 13px var(--display);letter-spacing:2px;text-transform:uppercase;color:var(--accent);width:112px}
.cta{background:var(--panel);border:1.5px solid var(--line);border-radius:20px;padding:20px 18px;display:flex;flex-direction:column;gap:12px}
.qprog{display:flex;gap:6px}
.qprog i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.qprog i.on{background:var(--accent)}
.foot{max-width:560px;margin:30px auto 0;font-size:13px;letter-spacing:3px;text-transform:uppercase;color:var(--mute);text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function hub(){
  const n = clues.size;
  const hint = n === 0 ? "Начнём с переписки. Там всё случилось."
    : n < 5 ? `Улик: ${n} из 5. Улики связаны между собой, обыщем остальное.`
    : "Все пять мест обысканы. Пора называть главного подозреваемого.";
  render(`
    <span class="eyebrow">Обыск · ${n} из 5</span>
    ${ox(hint)}
    <div class="map">${ORDER.map(k => `<button class="loc${clues.has(k) ? " done" : ""}" id="loc-${k}"><span class="lt">${PLACES[k].lt}</span>${PLACES[k].name}<small>${PLACES[k].sub}</small></button>`).join("")}</div>
    ${n === 5 ? btns([["accuse","Назвать виновного","primary"]]) : ""}
  `);
  ORDER.forEach(k => on("loc-" + k, () => SCENES[k]()));
}

/* механика 1: найди на экране */
function hunt(k, intro, mock, spots){
  const bads = Object.keys(spots).filter(x => spots[x].bad);
  render(`
    <span class="eyebrow">${PLACES[k].name}</span>
    ${intro}
    <div class="hunt" id="mock">${mock}</div>
    <p class="hint">Нажмите на то, что мешает продаже. Подозреваемых здесь: ${bads.length}.</p>
    <div id="fb"></div>
    <div id="fin"></div>
  `);
  let miss = 0, done = false; const caught = new Set();
  const fb = h => document.getElementById("fb").innerHTML = h;
  document.querySelectorAll("[data-spot]").forEach(el => el.onclick = () => {
    if (done) return;
    const key = el.dataset.spot, sp = spots[key];
    if (sp.bad) {
      if (caught.has(key)) return;
      el.classList.add("caught"); caught.add(key);
      const left = bads.length - caught.size;
      fb(`<div class="fb clue"><b>Попался! ${caught.size} из ${bads.length}</b>${sp.note}${left ? `<br><br>Ищите дальше: тут прячется ещё ${left}.` : ""}</div>`);
      if (!left) {
        done = true; if (!miss) point(k + "-find");
        document.getElementById("fin").innerHTML = btns([["next","Дальше: как исправить","primary"]]);
        on("next", () => COMPARE[k]());
      }
    } else {
      miss++; el.classList.add("fine");
      fb(`<div class="fb good"><b>Здесь всё в порядке</b>${sp.note}</div>`);
    }
  });
}

/* механика 2: что лучше */
function compare(k, q, a, b, right, why){
  if (Math.random() < .5) { [a, b] = [b, a]; right = right === "a" ? "b" : "a"; }
  render(`
    <span class="eyebrow">${PLACES[k].name} · как исправить</span>
    <h2>${q}</h2>
    <div class="vs">
      <button class="opt" id="oa"><span class="lab">Вариант 1</span>${a}</button>
      <button class="opt" id="ob"><span class="lab">Вариант 2</span>${b}</button>
    </div>
    <div id="fb"></div>
  `);
  const pick = v => {
    const ok = v === right;
    if (ok) point(k + "-fix");
    document.getElementById("o" + right).classList.add("right");
    document.getElementById("o" + (right === "a" ? "b" : "a")).classList.add("wrong");
    document.querySelectorAll(".opt").forEach(o => o.disabled = true);
    document.getElementById("fb").innerHTML = `<div class="fb ${ok ? "good" : "bad"}"><b>${ok ? "В точку" : "Не совсем"}</b>${why}</div>${btns([["next","Приколоть улику к делу","primary"]])}`;
    on("next", () => clue(k));
  };
  on("oa", () => pick("a")); on("ob", () => pick("b"));
}

function clue(k){
  clues.add(k);
  const p = PLACES[k];
  render(`
    <span class="eyebrow">Улика ${clues.size} из 5</span>
    <div class="fb clue"><b>${p.suspect}</b>${p.clue()}</div>
    <div class="tip"><b>Проверьте у себя</b>${p.tip}</div>
    ${btns([["back","Вернуться к обыску","primary"]])}
  `);
  on("back", hub);
}

    <h2>Кто сорвал сделку?</h2>
    ${ox("Все пять улик у нас на руках. Кого называете главным?")}
    ${btns(Object.keys(SUSP).map(k => ["s-" + k, SUSP[k].n]))}
  `);
  Object.keys(SUSP).forEach(k => on("s-" + k, () => verdict(k)));
}
function verdict(k){
  const root = k === "belief";
  const rank = score >= 9 ? "Старший детектив" : score >= 6 ? "Детектив" : "Стажёр";
  const plan = [
    "Открою последнюю переписку о цене и найду фразу, где извинился(ась).",
    "Запишу амбициозную цель: на сколько она больше нынешнего дохода.",
    "Сегодня поймаю у себя один признак мышления бедности.",
    "На ближайший отказ задам вопрос «что смущает?» вместо «подумаю».",
    "Допишу: «Большие деньги - это...» и спрошу, чьё это убеждение."
  ];
  render(`
    <span class="eyebrow">Дело закрыто</span>
    <span class="stamp ${score >= 6 ? "top3" : ""}">${rank}</span>
    <h2>${root ? "Вы нашли корень" : "Почти: это следствие"}</h2>
    <p class="lead">${SUSP[k].r}</p>
    <p class="muted">Чутьё: ${score} из ${MAXS}. ${score >= 9 ? "Почти всё нашли с первого раза." : score >= 6 ? "Хороший результат. Пройдите ещё раз, чтобы закрепить." : "Пройдите ещё раз: каждое прохождение закрепляет материал."}</p>
    <h2 style="font-size:24px">Как всё сложилось</h2>
    <div class="chain">
      <span><small>Убеждение</small>«Большие деньги - это нехорошо»</span><i>↓</i>
      <span><small>Стыд</small>«Только не пугайтесь»</span><i>↓</i>
      <span><small>Страх</small>Скидка раньше возражения</span><i>↓</i>
      <span><small>Сдача</small>Один отказ - и тишина</span><i>↓</i>
      <span><small>Рационализация</small>«Клиентка капризная»</span>
    </div>
    <h2 style="font-size:24px">Что вы повторили</h2>
    <ul class="recap">
      <li><b>Урок 1</b><span>Стыд и страх мешают назвать цену. Вы продаёте пользу, а не просите деньги.</span></li>
      <li><b>Урок 2</b><span>Новый опыт каждый день, амбициозная цель, правило трёх отказов, поиск убеждений.</span></li>
    </ul>
    <div class="cta">
      <h2 style="font-size:24px">План на неделю</h2>
      <ol class="week">${plan.map(p => `<li>${p}</li>`).join("")}</ol>
      <button class="ch" id="copy">Скопировать план</button>
      <p class="muted" id="copied" aria-live="polite"></p>
    </div>
    ${btns([["again","Пройти ещё раз","ghost"]])}
  `);
  on("again", intro);
  on("copy", () => {
    const text = "План на неделю:\n" + plan.map((p, i) => `${i + 1}. ${p}`).join("\n");
    const ok = () => document.getElementById("copied").textContent = "Скопировано. Вставьте в заметки.";
    const fail = () => document.getElementById("copied").textContent = "Не удалось скопировать. Выделите список выше и скопируйте вручную.";
    try { navigator.clipboard.writeText(text).then(ok, fail); } catch(e){ fail(); }
  });
}

intro();
</script>

</body>
</html>
